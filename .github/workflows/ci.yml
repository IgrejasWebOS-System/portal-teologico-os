name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci exige que package-lock.json contenha, sem margem, a árvore de
      # dependências que ELE MESMO vai resolver — incluindo variações
      # específicas de plataforma (ex.: @swc/helpers, que entra na árvore de
      # forma diferente quando o lock é gerado no Windows do dev vs. quando
      # o npm ci roda aqui no Linux/Ubuntu). Sem WSL/Docker local pra gerar
      # um lockfile "nascido no Linux", npm ci falha nesse cenário mesmo com
      # o lockfile 100% correto e reproduzível localmente. npm install
      # resolve a árvore normalmente (mesma fonte de verdade, package.json),
      # sem essa checagem estrita — troca segura aqui, já que não dependemos
      # de reprodutibilidade byte-a-byte do lock entre CI e dev.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # Placeholders — nenhum valor real aqui. Configure os secrets de
          # verdade em Settings > Secrets and variables > Actions no GitHub,
          # com esses mesmos nomes (ver .env.example para a lista completa).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
